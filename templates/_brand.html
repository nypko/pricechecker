{#- The DoorPrice mark: a D drawn as a door with its handle, in a rounded tile. Colours come from the theme (style.css .bm-*). -#}
{%- macro mark(size=28) -%}
<svg class="brand-mark" viewBox="0 0 32 32" width="{{ size }}" height="{{ size }}" aria-hidden="true"><rect width="32" height="32" rx="7" class="bm-tile"/><path d="M9 7h6.5a9 9 0 0 1 0 18H9z" class="bm-door"/><circle cx="14.6" cy="16" r="1.9" class="bm-tile"/></svg>
{%- endmacro -%}
