# Estimated import tax the buyer pays on delivery, per Ship-to destination. Shown (and added to the total, marked ≈)
# when a store's price doesn't include it (stores.yaml: shipping.<region>.duties_included: false).
# Charged on goods + shipping, the way customs values an import. Mobile phones have 0% customs duty in the EU, UK
# and Australia, so only VAT/GST counts. rate_pct: null = no estimate shown (rules too variable to state a number).
# Courier fees and thresholds checked 2026-10-19: DHL Express Germany customs terms (dhl.de), UK courier fee guides
# (worldfirst.com, vatcalculators.org.uk), Australian low-value GST guides; US tariff trackers disagree (tariffstool.com, ustariffrates.com).
regions:
  EU: {rate_pct: 21, name: "import VAT", note: "We estimate 21%, the EU average; VAT is 17-27% depending on the country. Phones have 0% customs duty. The courier also charges a clearance fee (e.g. DHL Germany: 2% of the tax, at least EUR 12.50)."}
  UK: {rate_pct: 20, name: "import VAT", note: "UK VAT 20% on goods + shipping; phones have 0% customs duty. The courier adds a handling fee: about GBP 11-12 or 2.5% of the tax (DHL, UPS, FedEx), GBP 8 with Royal Mail."}
  AU: {rate_pct: 10, name: "GST", note: "10% GST on goods + shipping; phones have no customs duty. Up to AUD 1,000 the seller should charge GST at checkout; above that it is collected at the border and the courier adds clearance charges."}
  US: {rate_pct: null, name: "import tariffs", note: "Sources disagree on the current tariff for China-made phones (from 0% to about 37.5% in October 2026), so we add no estimate - check before buying. Couriers add a brokerage fee."}
