name: Testing site

# testing.doorprice.app: every push to the `testing` branch is built from the saved prices (no store is contacted)
# and deployed as the Cloudflare Pages branch "testing", with a Testing banner and hidden from search engines.
# No Telegram, no IndexNow, nothing committed. Publishing = merging the change into main.
on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read   # build and deploy only: nothing is committed

concurrency:
  group: testing-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # this job never pushes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: python -m pytest -q
        env:
          DOORPRICE_CHECK_BUDGETS: "1"
      - name: Build from the saved prices
        env:
          DOORPRICE_ENV: testing
        run: python -m pricechecker.run --build-only --offline
      - name: Deploy as the "testing" branch
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          wranglerVersion: "3.90.0"   # the action's own default, pinned
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ vars.CF_PAGES_PROJECT || 'pricechecker' }} --branch=testing --commit-dirty=true
