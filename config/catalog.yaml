# Phones shown on the site. id + edition must match how the code normalizes store titles
# (run `python -m pricechecker.run` and check data/untracked.txt for models seen but not listed).
# also: other names stores use for the same phone (normalized ids), e.g. "Mate 90 RS Ultimate Design" for the Mate 90 RS.
# ram: the RAM every unit has (GB), for Shopify listings that give storage only ("256GB" -> 12/256).
# offers: product page URLs for 'webpage' stores (Giztop, Banggood, Geekbuying). Optional storage: "16/512".
# Shopify and feed stores are matched automatically by id + edition.

# announced: first official launch (usually China) - checked 2026-10-19 against GSMArena, PhoneArena, Huawei Central,
# Gizmochina, Wikipedia and brand announcements. The site lists phones newest first by this date.
