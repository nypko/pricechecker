# Site-wide details shown on the About and Privacy pages, and the site's own address.
base_url: https://doorprice.app
# domain_live: true once https://doorprice.app serves this site. Then pages name it as their canonical address,
# visitors on the old pricechecker-87q.pages.dev address are sent to the same page on doorprice.app, and
# sitemap.xml / robots.txt use it. Keep false until it works, or visitors are sent to a dead address.
domain_live: true
# contact_email: shown on About and Privacy. Leave empty until mail to it actually arrives.
contact_email: hello@doorprice.app
country: Bulgaria
# reports_live: true once Cloudflare KV is bound as REPORTS (README: Buyer reports). Shows the "How did your order
# arrive?" form on phone pages; until then it would only answer "not switched on yet".
reports_live: false
# IndexNow (Bing, Yandex, Seznam, Naver...): after each deploy, pages whose prices changed are submitted
# (pricechecker/indexnow.py). The key is public by design: it is served at /<key>.txt to prove we own the domain.
# telegram: the price-drop channel's @username (pricechecker/telegram.py posts there); linked in every page's footer.
telegram: DoorPriceDeals
# reddit: the community's name without r/ (orders, customs experiences, feedback); linked in every page's footer.
reddit: DoorPrice
indexnow_key: d3e0a819ceb48999304d7402a5579dd0
