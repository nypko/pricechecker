# Stores to check every hour.
#   type: shopify | webpage | feed | official_api
#   affiliate_link: template for tracking links. Placeholders: {url} {url_enc} {sep} {id}
#   affiliate_id / affiliate_id_env: your id (or the name of an env var / GitHub secret holding it)
# Copy the exact link format from each store's affiliate dashboard - the templates below are placeholders.
#
#   terms: payment / shipping conditions shown on the site (Payment + Ship-to selectors)
#     payment.<card|paypal|bank_transfer>: fee_pct (surcharge) or discount_pct; null = unknown/unverified
#     shipping.<EU|UK|US|AU|Global>: cost (+ currency if not the store's) ; null = not listed / unknown
#       days: [min, max] working days to delivery as the store states them ([null, 8] = "up to 8"); omit if not stated.
#       Trading Shenzhen: 10-14 days transit + 2-5 days processing (stated on its EU terms; processing is the same everywhere)
#       duties_included: true if the price already covers the destination's import duties + VAT/GST, false if the
#       buyer pays them on delivery, omit if the store doesn't say (the site then shows "import tax not stated")
#   trust: review score (source, count), warranty_months, returns_days - entered by hand with the date checked;
#     shown next to the store on phone pages. An EU warehouse (part_of) shows its store's.
#     watch: pages re-checked daily; if `expect` (regex) is no longer found, the site flags the terms for review

stores:
  wonda:
    label: Wonda Mobile
    mentions: ["wondamobile", "wonda mobile"]   # names buyers use for it, searched through Reddit's API (buyer_reports.py)
    type: shopify
    base_url: https://wondamobile.com
    currency: USD
    product_types: [Mobile]
    exclude_title: "used|kit|demo|refurb"
    terms:   # verified 2026-10-16 from https://wondamobile.com/pages/billing-information + /policies/shipping-policy
      payment:
        bank_transfer: {discount_pct: 4.5, note: "Local bank transfer. EUR only from: AT BE HR CY CZ DK EE FI FR DE GR HU IE IM IT LV LT LU MT MC NL PT RO SI ES SE CH (not BG/PL/SK); GBP: UK, JE; USD: US"}
        paypal: {fee_pct: 0}
        card: {fee_pct: 0, note: "No handling fee; your bank may charge foreign-transaction fees"}
      shipping:
        EU: {days: [12, 15], cost: 0, note: "Free basic shipping, 12-15 business days; duties/VAT not stated. Buyers report: Global Priority usually arrives with no customs or VAT, DHL deliveries often do get charged (XDA forums, Trustpilot, 2026)"}
        UK: {days: [12, 15], cost: 0, note: "Free basic shipping, 12-15 business days; duties/VAT not stated. Buyers report: Global Priority usually arrives with no customs or VAT, DHL deliveries often do get charged (XDA forums, Trustpilot, 2026)"}
        US: {days: [12, 15], cost: 0, note: "Free basic shipping, 12-15 business days; duties not stated. Buyers report: Global Priority usually arrives with no customs or VAT, DHL deliveries often do get charged (XDA forums, Trustpilot, 2026)"}
        CA: {days: [12, 15], cost: 0, note: "Free basic shipping, 12-15 business days (policy names no countries); duties and GST/HST not stated - you may pay them on delivery. Bank transfer isn't offered in CAD"}
        AU: {days: [12, 15], cost: 0, note: "Free basic shipping, 12-15 business days (policy names no countries); duties/GST not stated. Buyers report: Global Priority usually arrives with no customs or VAT, DHL deliveries often do get charged (XDA forums, Trustpilot, 2026)"}
        Global: {days: [12, 15], cost: 0, note: "Free basic shipping, 12-15 business days (policy names no countries); duties and import tax not stated - you may pay them on delivery"}
      watch:   # re-checked daily; if the text disappears the site flags the terms as "needs review"
        - {url: "https://wondamobile.com/pages/billing-information", expect: "4\\.5% discount"}
        - {url: "https://wondamobile.com/policies/shipping-policy", expect: "free basic shipping"}
    affiliate_link: "{url}{sep}ref={id}"   # referral link from the dashboard: https://www.wondamobile.com?ref=ivaylo_kirov
    affiliate_id: ivaylo_kirov
    google_play: "Installs Google Play, Gmail and Contacts before shipping"   # wondamobile.com/pages/about-us-wonda-mobile, checked 2026-10-20
    trust: {reviews: {score: 4.8, count: 3377, source: Trustpilot, url: "https://www.trustpilot.com/review/wondamobile.com"}, warranty_months: 12, returns_days: 7, checked: 2026-10-19}   # "up to 12 months warranty" (warranty policy); 7 days from arrival (refund policy)

  mobilemarvel:
    label: The Mobile Marvel
    mentions: ["mobile marvel", "themobilemarvel"]   # names buyers use for it, searched through Reddit's API (buyer_reports.py)
    type: shopify
    base_url: https://www.themobilemarvel.com
    currency: HKD
    exclude_title: "used|kit|demo|refurb|lens|case|cover|charger|cable|watch|buds|pad|tablet|protector|strap"
    affiliate_link: "{url}{sep}ref={id}"
    affiliate_id: YOUR_MOBILEMARVEL_ID
    trust: {reviews: {score: 4.8, count: 164, source: Trustpilot, url: "https://www.trustpilot.com/review/themobilemarvel.com"}, warranty_months: 12, returns_days: 7, checked: 2026-10-19}   # "12-Month Warranty Protection" (homepage); 7 days non-faulty, 10 days faulty
    terms:   # verified 2026-10-16 from /pages/shipping, /pages/custom-duties, /apps/frequently-asked-questions
      payment:
        bank_transfer: {discount_pct: 4.75, note: "Bank transfers 4.75% off all orders (manual confirmation)"}
        paypal: {fee_pct: 0}
        card: {fee_pct: 0}
      # store-wide promotion applied automatically at checkout (2026-10-19, homepage banner: "2% summer sale at checkout - Auto Applied").
      # Counts only while `watch` text is on the store's homepage (pricechecker/promos.py) and before `until`, if set.
      # Not stated whether it combines with the bank-transfer discount, so with bank transfer only the larger 4.75% is counted.
      promo: {pct: 2, label: "Summer sale", watch: "2% summer sale", stacks_with_bank: false, note: "2% summer sale, applied automatically at checkout. The store doesn't say whether it combines with the bank-transfer discount, so with bank transfer we count only the 4.75%."}
      shipping:
        EU: {days: [6, 12], duties_included: true, cost: 450, currency: HKD, note: "EU tax-included (DDP) via UPS, 6-12 business days"}
        UK: {days: [null, 8], duties_included: true, cost: 300, currency: HKD, note: "Standard (DHL/FedEx/UPS), duties & VAT included"}
        US: {days: [null, 8], duties_included: true, cost: 300, currency: HKD, note: "Standard (DHL/FedEx/UPS), duties & taxes included"}
        CA: {days: [null, 8], duties_included: true, cost: 300, currency: HKD, note: "Standard (DHL/FedEx/UPS), up to 8 business days; the store says Canadian prices are fully landed: duties, brokerage and GST/HST included (shipping page, checked 2026-10-20)"}
        AU: {days: [null, 8], duties_included: true, cost: 300, currency: HKD, note: "Standard (all regions except EU), up to 8 business days; duties & GST included"}
        Global: {days: [null, 8], duties_included: null, cost: 300, currency: HKD, note: "Standard (all regions except EU), DHL/FedEx/UPS; duties and taxes are stated as included for the UK, US and Australia, not for other countries"}
      watch:
        - {url: "https://www.themobilemarvel.com/pages/shipping", expect: "4\\.75%"}
        - {url: "https://www.themobilemarvel.com/pages/shipping", expect: "300 HKD"}

  averagedad:
    label: Average Dad Tech
    mentions: ["average dad", "averagedad"]   # names buyers use for it, searched through Reddit's API (buyer_reports.py)
    type: shopify         # robots.txt (2026-10-20) allows /products, /policies and meta.json; no bot challenge
    base_url: https://averagedadofficial.com
    currency: GBP         # UK business (Trustpilot contact details); phones ship from China / Hong Kong
    exclude_title: "used|kit|demo|refurb|lens|case|cover|screen|charger|cable|watch|buds|pad|tablet|protector|strap|accessor"
    trust: {reviews: {score: 4.7, count: 268, source: Trustpilot, url: "https://www.trustpilot.com/review/averagedadofficial.com"}, warranty_months: 12, returns_days: 14, checked: 2026-10-20}   # /pages/warranty: 12 months, buyer ships in; /policies/refund-policy: 14 days unused and sealed, buyer pays return shipping, 20% restocking fee once opened
    terms:   # verified 2026-10-20 from /policies/shipping-policy, /policies/refund-policy, /pages/warranty
      payment:
        card: {fee_pct: 0, note: "UK store: card surcharges on consumer cards are banned in the UK (Payment Surcharges Regulations)"}
        paypal: {fee_pct: null, note: "Payment methods and fees aren't published; shown at checkout"}
        bank_transfer: {discount_pct: null, note: "Payment methods and fees aren't published; shown at checkout"}
      shipping:   # "Global shipping costs are set to £29.99" (incl. UK and EU); USA flat $59.99. DHL Express, UPS or FedEx, phones 5-8 business days.
        # Import tax: the store "will do our best to mitigate and remove all customs/VAT fees ... not always possible in countries
        # such as Greece, Hungary and Ireland" and for high fees "typically split the bill 50/50" - not stated as included, so omitted.
        EU: {days: [5, 8], cost: 29.99, note: "£29.99 to the EU from China/Hong Kong (DHL Express, UPS or FedEx), 5-8 business days. Import VAT isn't stated as included: the store says most parcels arrive with no fees and it tries to avoid them, but not always (it names Greece, Hungary and Ireland) and may split high fees 50/50."}
        UK: {days: [5, 8], cost: 29.99, note: "£29.99 from China/Hong Kong (DHL Express, UPS or FedEx), 5-8 business days. Import VAT isn't stated as included: the store says most parcels arrive with no fees and it tries to avoid them, and may split high fees 50/50."}
        US: {days: [5, 8], cost: 59.99, currency: USD, note: "Flat $59.99 to the US, and you must give a FedEx account number at checkout, so duties and brokerage are billed to your FedEx account. 5-8 business days."}
        CA: {days: [5, 8], cost: 29.99, note: "£29.99 global shipping from China/Hong Kong (DHL Express, UPS or FedEx), 5-8 business days. GST/HST isn't stated as included (the shipping policy doesn't name Canada)."}
        AU: {days: [5, 8], cost: 29.99, note: "£29.99 global shipping from China/Hong Kong (DHL Express, UPS or FedEx), 5-8 business days. GST isn't stated as included."}
        Global: {days: [5, 8], cost: 29.99, note: "£29.99 global shipping from China/Hong Kong (DHL Express, UPS or FedEx), 5-8 business days. Import tax isn't stated as included."}
      watch:
        - {url: "https://averagedadofficial.com/policies/shipping-policy", expect: "29\\.99"}
        - {url: "https://averagedadofficial.com/policies/refund-policy", expect: "14 day"}

  etoren:
    label: Etoren
    type: sitemap
    enabled: false        # 2026-10-20: robots.txt allows /products/ (Crawl-delay: 10, no ?page=), but product pages answer
                          # PriceCheckerBot with a Cloudflare challenge (403 "Just a moment"). Enable once they allowlist the
                          # bot or provide a product feed. Regional storefronts: www (USD, worldwide), eu., uk., au., de. ...
    sitemap_url: https://ww.etoren.com/sitemap/sitemap_ww.xml
    currency: USD
    trust: {reviews: {score: 4.5, count: 2200, source: Trustpilot, url: "https://www.trustpilot.com/review/etoren.com"}, checked: 2026-10-20}   # approximate, from search results - re-check before enabling

  trinity:
    label: Trinity Electronic
    type: webpage
    enabled: false        # behind Cloudflare bot protection (403 challenge) - enable once they allowlist
                          # PriceCheckerBot or provide a product feed (then switch to type: feed)
    currency: HKD
    affiliate_link: "{url}{sep}ref={id}"
    affiliate_id: YOUR_TRINITY_ID

  tradingshenzhen:
    label: Trading Shenzhen
    mentions: ["tradingshenzhen", "trading shenzhen"]   # names buyers use for it, searched through Reddit's API (buyer_reports.py)
    type: sitemap         # 2026-10-16: answers PriceCheckerBot again (was 403); one product page per phone + storage
    sitemap_url: https://tradingshenzhen.com/sitemap-products-en.xml
    promo_pages: ["https://tradingshenzhen.com/en/"]   # read daily for promotion text (pricechecker/promos.py)
    exclude_url: "case|kopfhorer|headphone|pad|tablet|book|watch|band|gadget|sonstiges|console|coupon|charger|cable"
    exclude_title: "used|refurb|demo|case|cover"
    request_spacing_sec: 5   # gentle: Cloudflare-protected PrestaShop with ~600 KB pages
    sub_stores: {tradingshenzhen_eu: "eu warehouse"}   # listings shipped from their EU warehouse
    # if they block scripts again: switch to `type: feed` with the affiliate product feed
    #   feed_url_env: TSZ_FEED_URL, feed_format: xml|csv,
    #   feed_fields: {title: title, link: link, price: price, availability: availability}
    currency: EUR
    affiliate_link: "{url}{sep}affp={id}"   # from the affiliate dashboard: .../gift-coupon/10-voucher?affp=313618
    affiliate_id: "313618"
    trust: {reviews: {score: 4.7, count: 11216, source: Trustpilot, url: "https://www.trustpilot.com/review/tradingshenzhen.com"}, checked: 2026-10-19}   # warranty and returns pages are behind a bot check: not stated here
    terms:   # verified 2026-10-16 from /en/content/payment-regulations, /customs-and-duties, /transportation-regulation
      payment:
        bank_transfer: {discount_pct: 0, note: "Only via EPS (AT), iDEAL (NL), P24 (PL), Giropay, Bancontact; no discount"}
        paypal: {fee_pct: 4, note: "Store says it pays about 4% PayPal fees from China and passes them on; exact amount at checkout"}
        card: {fee_pct: 0, note: "Visa/Mastercard, Google Pay, Apple Pay via Stripe; no fee mentioned. Card address must match shipping address"}
      shipping:   # Global Priority from China; EU-warehouse items ship free in 2-5 working days
        EU: {days: [12, 19], duties_included: true, cost: null, cost_min: 10, currency: EUR, note: "Global Priority from EUR 10 (used here as the minimum; exact at checkout) (exact at checkout), 10-14 working days + 2-5 processing; no customs or import VAT - the store covers them"}
        UK: {days: [12, 19], duties_included: true, cost: null, cost_min: 10, currency: EUR, note: "Global Priority from EUR 10 (used here as the minimum; exact at checkout), 10-14 working days; store covers customs and import VAT, refunds any charges"}
        US: {days: [12, 19], duties_included: true, cost: null, cost_min: 10, currency: EUR, note: "Global Priority from EUR 10 (used here as the minimum; exact at checkout), 10-14 working days; store covers customs and import costs, refunds any charges"}
        CA: {days: [12, 19], duties_included: true, cost: null, cost_min: 10, currency: EUR, note: "Global Priority from EUR 10 (used here as the minimum; exact at checkout), 10-14 working days; store says it covers customs and import tax for every destination and refunds any charges (Canada isn't named separately)"}
        AU: {days: [12, 19], duties_included: true, cost: null, cost_min: 10, currency: EUR, note: "Global Priority from EUR 10 (used here as the minimum; exact at checkout), 10-14 working days; store covers customs and GST, refunds any charges"}
        Global: {days: [12, 19], duties_included: true, cost: null, cost_min: 10, currency: EUR, note: "Global Priority from EUR 10 (used here as the minimum; exact at checkout), 10-14 working days; store says it covers customs and import tax and refunds any charges"}
      watch:
        - {url: "https://tradingshenzhen.com/en/content/customs-and-duties", expect: "no customs duty and no import VAT"}
        - {url: "https://tradingshenzhen.com/en/content/payment-regulations", expect: "about 4%"}

  tradingshenzhen_eu:
    label: Trading Shenzhen (EU warehouse)
    part_of: tradingshenzhen   # its listings come from the Trading Shenzhen check ("... - EU Warehouse" titles)
    currency: EUR
    affiliate_link: "{url}{sep}affp={id}"
    affiliate_id: "313618"
    terms:   # verified 2026-10-16 from /en/content/transportation-regulation and /customs-and-duties
      payment:
        bank_transfer: {discount_pct: 0, note: "Only via EPS (AT), iDEAL (NL), P24 (PL), Giropay, Bancontact; no discount"}
        paypal: {fee_pct: 4, note: "Store says it pays about 4% PayPal fees and passes them on; exact amount at checkout"}
        card: {fee_pct: 0, note: "Visa/Mastercard, Google Pay, Apple Pay via Stripe; no fee mentioned"}
      shipping:
        EU: {days: [2, 5], duties_included: true, cost: 0, currency: EUR, note: "Free from the EU warehouse (DHL), 2-5 working days; already in the EU, no customs or import VAT"}
        UK: {cost: null, note: "EU warehouse shipping outside the EU not stated"}
        US: {cost: null, note: "EU warehouse shipping outside the EU not stated"}
        CA: {cost: null, note: "EU warehouse shipping outside the EU not stated"}
        AU: {cost: null, note: "EU warehouse shipping outside the EU not stated"}
        Global: {cost: null, note: "EU warehouse shipping outside the EU not stated"}

  giztop:
    label: Giztop
    mentions: ["giztop"]   # names buyers use for it, searched through Reddit's API (buyer_reports.py)
    type: magento         # walks the phone category, then reads variant prices from each tracked phone's page
    base_url: https://www.giztop.com
    categories: [/phones.html]
    exclude_title: "almost new|used|refurbished|open box"
    aliases: {xiaomi-17-ultra-by-leica: xiaomi-17-ultra-leica-edition}
    currency: USD
    affiliate_link: "{url}{sep}ref={id}"
    affiliate_id: YOUR_GIZTOP_ID
    trust: {reviews: {score: 4.0, count: 2134, source: Trustpilot, url: "https://www.trustpilot.com/review/giztop.com"}, warranty_months: 12, returns_days: 14, checked: 2026-10-19}   # "default product warranty period is one year" (its heading says 2 years); 14 days if unopened
    terms:   # verified 2026-10-16 from /payment/, /giztop-shipping-options/, /customs-duty/
      payment:
        bank_transfer: {discount_pct: 0, min_order_usd: 1500, note: "Wire transfer only for orders over $1,500 (request by ticket), no discount"}
        paypal: {fee_pct: 0, note: "Charged in USD"}
        card: {fee_pct: 0, note: "Cards via PayPal"}
      # codes the shopper types: shown as a hint, never in totals; hidden after `until` or once `watch` leaves the homepage
      coupons:
        - {code: H2026, text: "store says it saves up to 30%", until: 2026-10-30, watch: "H2026"}
      shipping:
        EU: {duties_included: null, cost: null, note: "Weight-based, shown in cart. Giztop says it pays EU duties/VAT through IOSS, but IOSS only covers parcels up to EUR 150 and its own customs page says customs may charge the buyer for smartphones; buyers report paying on delivery (Trustpilot, 2026)"}
        UK: {duties_included: false, cost: null, note: "Weight-based, shown in cart; buyer pays UK VAT. Giztop says it usually declares a lower value on the parcel - customs can reassess and charge on the real price"}
        US: {duties_included: false, cost: null, note: "Weight-based, shown in cart; buyer pays US duties. Giztop says it usually declares a lower value on the parcel - customs can reassess and charge on the real price"}
        CA: {duties_included: false, cost: null, note: "Weight-based, shown in cart; buyer pays GST/HST on delivery. Giztop says Canada has 'few duties and taxes' because it usually declares a lower value - the CBSA can reassess and charge on the real price"}
        AU: {duties_included: false, cost: null, note: "Weight-based, shown in cart; prices exclude import tax, buyer pays AU GST/duties"}
        Global: {duties_included: false, cost: null, note: "Weight-based, shown in cart; prices exclude import tax, buyer pays duties and tax on delivery"}
      watch:
        - {url: "https://www.giztop.com/payment/", expect: "Wired Transfer"}
        - {url: "https://www.giztop.com/customs-duty", expect: "IOSS"}

  banggood:
    label: Banggood
    enabled: false        # 2026-10-16: carries no current flagships (only accessories "for Xiaomi 17 Pro" etc.)
    type: webpage         # switch to type: feed once you have the affiliate product feed
    currency: USD
    affiliate_link: "{url}{sep}p={id}"
    affiliate_id: YOUR_BANGGOOD_ID

  geekbuying:
    label: Geekbuying
    enabled: false        # 2026-10-16: phones are rugged/budget models (FOSSiBOT etc.), no tracked flagships
    type: webpage
    currency: USD
    affiliate_link: "{url}{sep}aff={id}"
    affiliate_id: YOUR_GEEKBUYING_ID

  amazon:
    label: Amazon
    type: official_api    # Product Advertising API - scraping Amazon is against its terms
    credential_envs: [AMAZON_ACCESS_KEY, AMAZON_SECRET_KEY, AMAZON_PARTNER_TAG]
    affiliate_link: "{url}{sep}tag={id}"
    affiliate_id_env: AMAZON_PARTNER_TAG

  aliexpress:
    label: AliExpress
    type: official_api    # AliExpress Portals affiliate API
    credential_envs: [ALIEXPRESS_APP_KEY, ALIEXPRESS_APP_SECRET, ALIEXPRESS_TRACKING_ID]
    affiliate_id_env: ALIEXPRESS_TRACKING_ID
