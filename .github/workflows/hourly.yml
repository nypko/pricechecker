name: Hourly price check

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (GitHub runs scheduled jobs on a best-effort basis)
  workflow_dispatch:

permissions:
  contents: write   # commit data/ (price history + caches)
  issues: write     # file new/ended store promotions for review (pricechecker/promos.py)

concurrency:
  group: price-check
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # progress shows in the log as it happens (and survives a timeout)
  # Cloudflare Pages project name -> https://<name>.pages.dev (override with a repository variable if taken)
  CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'pricechecker' }}
  # deploy steps are skipped (not failed) until the Cloudflare secrets are added
  HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55   # a normal run is ~12-15 min (Shopify needs ~75 s between requests); ~30 min once a week for rates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Check prices and build site
        env:
          TSZ_FEED_URL: ${{ secrets.TSZ_FEED_URL }}
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
        run: |   # exit 3 = no store answered this hour; still publish the last known prices. Anything else fails the job.
          python -m pricechecker.run || [ $? -eq 3 ]
      - name: Report store promotions
        if: always() && hashFiles('.promo_report.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Store promotions to review ($(date -u +%Y-%m-%d))" --body-file .promo_report.md
      - name: Commit price history
        if: always()   # also after a timeout: keeps the caches (store rates, pages) so the next run is shorter
        run: |
          git config user.name "price-checker-bot"
          git config user.email "price-checker-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet && git push
      - name: Create the Cloudflare Pages project (first run only)
        if: env.HAS_CLOUDFLARE == 'true'
        continue-on-error: true   # fails harmlessly once the project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.CF_PAGES_PROJECT }} --production-branch=main
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true
