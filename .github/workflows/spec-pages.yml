name: Spec pages watch

on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read   # nothing is committed
  issues: write    # file a review issue when a brand spec page changed

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # this job never pushes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pricechecker.specpages watch
      - name: Report changed spec pages
        if: always() && hashFiles('.spec_report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |   # one open review issue at a time: later reports are added to it as comments
          n=$(gh issue list --state open --author app/github-actions --search 'in:title "Spec pages changed"' --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file .spec_report.md
          else gh issue create --title "Spec pages changed ($(date -u +%Y-%m-%d))" --body-file .spec_report.md; fi
