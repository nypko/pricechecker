# Key specs shown on the phone page. Copied from Apple's China spec page (see sources below), checked 2026-10-31, and
# cross-checked with apple.com/iphone-duo/specs (US model A3447: same hardware, but MagSafe/Qi2 up to 25 W and mmWave 5G).
# A field the page does not give is left out rather than guessed: Apple states no battery capacity, no RAM and no maximum
# wired charging power. Model numbers: support.apple.com/zh-cn/108044 (A3721 = China mainland).
